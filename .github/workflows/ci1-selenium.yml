# CI - Selenium + Mocha + Mochawesome
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Step 3: Install dependencies
      - name: Install dependencies
        run: npm ci

      # Step 4: Setup Chrome
      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      # Step 5: Run Mocha tests (tc_all) with screenshots & report
      - name: Run Mocha tests (tc_all)
        env:
          CI: true
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          # Jalankan semua test
          npm run tc_all

          # Tampilkan path report Mochawesome
          echo "HTML report: $(pwd)/mochawesome-report/report_all/report_all.html"

      # Step 6: Upload Mochawesome report sebagai artifact
      - name: Upload test report
        uses: actions/upload-artifact@v3
        with:
          name: mochawesome-report
          path: mochawesome-report/
